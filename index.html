<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upper Homadola Smart School</title>
<meta name="description" content="G/Upper Homadola School, Sri Lanka. Grades 1–11.">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--maroon:#650F2A;--maroon2:#800020;--bg:#fff;--surface:#F8F6F7;--text:#1b1418;--muted:#716970;--border:#E9DFE3;--ok:#21734A;--err:#B3324F;--ink:#650F2A;--shadow:0 1px 2px rgba(101,15,42,.08),0 12px 32px -12px rgba(101,15,42,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#120D12;--surface:#1c141b;--text:#f4eef1;--muted:#b5a9b0;--border:#35272f;--ink:#e58fa7;--err:#ff8da5;--ok:#6fd39f}}
:root[data-theme=dark]{color-scheme:dark;--bg:#120D12;--surface:#1c141b;--text:#f4eef1;--muted:#b5a9b0;--border:#35272f;--ink:#e58fa7;--err:#ff8da5;--ok:#6fd39f}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.65 Inter,"Noto Sans Sinhala",system-ui,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
html[lang=si] body{font-family:"Noto Sans Sinhala",Inter,sans-serif;line-height:1.8}
h1,h2,h3{font-family:Fraunces,"Noto Sans Sinhala",serif;line-height:1.2;margin:0 0 .5em}
html[lang=si] h1,html[lang=si] h2,html[lang=si] h3{font-family:"Noto Sans Sinhala",serif;line-height:1.45}
a{color:var(--ink)}:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{width:min(1120px,100% - 2rem);margin-inline:auto}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:1rem;min-height:68px;position:relative}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:600;text-decoration:none;color:var(--text)}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--maroon),var(--maroon2));display:grid;place-items:center}
nav{margin-inline-start:auto;display:flex;align-items:center;gap:.25rem}
nav a.l{padding:.5rem .6rem;text-decoration:none;color:var(--text);font-size:.92rem;position:relative}
nav a.l::after{content:"";position:absolute;left:.6rem;right:.6rem;bottom:.2rem;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .25s}
nav a.l:hover::after{transform:scaleX(1)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.55rem 1.1rem;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.p{background:var(--maroon);border-color:var(--maroon);color:#fff}
#menu{display:none}
@media(max-width:900px){#menu{display:inline-flex;margin-inline-start:auto}nav{position:absolute;top:68px;left:-1rem;right:-1rem;margin:0;background:var(--bg);flex-direction:column;align-items:stretch;padding:1rem;border-bottom:1px solid var(--border);transform:translateY(-130%);transition:transform .3s;z-index:-1}nav.open{transform:none}}
.hero{padding:clamp(3rem,9vw,6rem) 0 3rem;background:radial-gradient(900px 400px at 85% 0,color-mix(in srgb,var(--maroon) 14%,transparent),transparent)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;align-items:end}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.1rem,6vw,4rem);font-weight:800}.hero p{color:var(--muted);max-width:52ch}
.cta{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.4rem}
.rise>*{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}.rise>*:nth-child(2){animation-delay:.12s}.rise>*:nth-child(3){animation-delay:.24s}.rise>*:nth-child(4){animation-delay:.36s}
@keyframes rise{to{opacity:1;transform:none}}
.steps{display:flex;align-items:flex-end;gap:6px;height:250px}
.steps b{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--maroon2),var(--maroon));color:#fff;font:600 .8rem/1 Inter,sans-serif;display:flex;justify-content:center;padding-top:8px;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.7,.2,1) forwards;height:calc(14% + var(--i)*7.6%);animation-delay:calc(.3s + var(--i)*.06s)}
@keyframes grow{to{transform:scaleY(1)}}
.cap{font-size:.85rem;color:var(--muted);margin-top:.6rem}
section{padding:3.5rem 0}section.alt{background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:1.2rem;box-shadow:var(--shadow)}
.ph{border:1.5px dashed var(--muted);border-radius:14px;padding:1.1rem;color:var(--muted)}.ph strong{color:var(--text);display:block}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.6rem}
.grades span{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:.7rem;text-align:center;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.6rem}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}.reveal.in{opacity:1;transform:none}
label{display:block;font-weight:600;margin:.8rem 0 .3rem}
input,select,textarea{width:100%;min-height:44px;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
.login{max-width:460px}.msg{min-height:1.4em;font-weight:600}.msg.e{color:var(--err)}.msg.o{color:var(--ok)}
.row{display:flex;gap:.5rem;flex-wrap:wrap}.row>*{flex:1}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:1rem 0}.tabs .btn[aria-current=true]{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:start;padding:.5rem;border-bottom:1px solid var(--border)}
.hide{display:none!important}
footer{border-top:1px solid var(--border);padding:2rem 0;color:var(--muted);font-size:.9rem}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.rise>*,.reveal{opacity:1;transform:none}.steps b{transform:none}}
@media print{header,footer,.tabs,.btn,#out,.hero,section:not(#login){display:none!important}}
.hero{position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(44px);opacity:.3;background:var(--maroon2);pointer-events:none;animation:float 9s ease-in-out infinite;translate:var(--px,0) var(--py,0);transition:translate .5s ease-out}
@keyframes float{50%{transform:translate(18px,-22px) scale(1.08)}}
.hero .wrap{position:relative}.hero .wrap>.rise:last-child{translate:var(--sx,0) var(--sy,0);transition:translate .4s ease-out}
.glow{position:fixed;left:0;top:0;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ink) 16%,transparent),transparent 65%);pointer-events:none;z-index:1;opacity:0;transition:opacity .4s;will-change:transform}
.ring{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--ink);border-radius:50%;pointer-events:none;z-index:50;opacity:0;transition:opacity .3s,width .2s,height .2s,margin .2s,background .2s;will-change:transform}
.ring.big{width:62px;height:62px;margin:-31px 0 0 -31px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.prog{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--maroon),var(--ink));transform:scaleX(0);transform-origin:left;z-index:60;pointer-events:none}
.card,.grades span{transition:transform .18s ease-out,box-shadow .2s;will-change:transform}
.card:hover,.grades span:hover{box-shadow:0 18px 40px -16px rgba(101,15,42,.45)}
.cta .btn{transition:translate .2s ease-out,transform .15s,box-shadow .2s}
.btn{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s linear forwards;pointer-events:none}
@keyframes rp{to{transform:scale(3.5);opacity:0}}
.mark{animation:pulse 3.5s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--maroon) 0%,transparent),0 0 18px color-mix(in srgb,var(--maroon) 55%,transparent)}}
@media(prefers-reduced-motion:reduce){.blob,.mark{animation:none}.glow,.ring{display:none}}
</style>
</head>
<body>
<header><div class="wrap bar">
<a class="brand" href="#top"><span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 11.5V16c0 1 2.2 2.5 5 2.5s5-1.5 5-2.5v-4.5"/></svg></span>Upper Homadola</a>
<button class="btn" id="menu" aria-expanded="false" aria-controls="nav" data-i="menu">Menu</button>
<nav id="nav" aria-label="Main">
<a class="l" href="#about" data-i="nAbout">About</a><a class="l" href="#academics" data-i="nAcad">Academics</a><a class="l" href="#news" data-i="nNews">School News</a><a class="l" href="#events" data-i="nEvents">Events</a><a class="l" href="#gallery" data-i="nGal">Gallery</a><a class="l" href="#contact" data-i="nContact">Contact</a>
<a class="btn p" href="#login" data-i="nLogin">Student/Teacher Login</a>
<button class="btn" id="lang" aria-label="Language">සිං</button><button class="btn" id="theme" aria-label="Toggle theme">◐</button>
</nav></div></header>
<main>
<div class="hero" id="top"><div class="wrap">
<div class="rise"><h1 data-i="h1"></h1><p data-i="lead"></p><div class="cta"><a class="btn p" href="#about" data-i="explore"></a><a class="btn" href="#login" data-i="portal"></a></div></div>
<div class="rise" aria-hidden="true"><div class="steps"><b style="--i:0">1</b><b style="--i:1">2</b><b style="--i:2">3</b><b style="--i:3">4</b><b style="--i:4">5</b><b style="--i:5">6</b><b style="--i:6">7</b><b style="--i:7">8</b><b style="--i:8">9</b><b style="--i:9">10</b><b style="--i:10">11</b></div><p class="cap" data-i="cap"></p></div>
</div></div>
<section id="about" class="alt"><div class="wrap"><h2 data-i="nAbout"></h2><div class="grid reveal" id="aboutBox"></div></div></section>
<section id="academics"><div class="wrap"><h2 data-i="nAcad"></h2><p style="color:var(--muted)" data-i="acadP"></p><div class="grades reveal" id="grades"></div></div></section>
<section id="news" class="alt"><div class="wrap"><h2 data-i="nNews"></h2><div class="grid" id="newsList"></div></div></section>
<section id="events"><div class="wrap"><h2 data-i="nEvents"></h2><div class="grid" id="evList"></div></div></section>
<section id="gallery" class="alt"><div class="wrap"><h2 data-i="nGal"></h2><div id="galList"></div></div></section>
<section id="contact"><div class="wrap"><h2 data-i="nContact"></h2><div class="grid reveal" id="contactBox"></div></div></section>
<section id="login" class="alt"><div class="wrap">
<h2 data-i="nLogin"></h2>
<div class="card login" id="loginBox">
<p class="msg" id="cfgMsg"></p>
<form id="lf" novalidate>
<label for="u" data-i="user"></label><input id="u" autocomplete="username" autocapitalize="off">
<label for="p" data-i="pass"></label><input id="p" type="password" autocomplete="current-password">
<p class="msg e" id="lerr" role="alert"></p>
<button class="btn p" id="lbtn" type="submit" data-i="signin"></button>
</form></div>
<div id="app" class="hide">
<div class="row" style="align-items:center"><h3 id="who" style="margin:0;flex:3"></h3><button class="btn" id="out" style="flex:0 0 auto">Sign out</button></div>
<div class="tabs" id="tabs" role="tablist"></div><div class="card" id="panel" aria-live="polite"></div>
</div></div></section>
</main>
<footer><div class="wrap" data-i="foot"></div></footer>

h1:"පාසල් ප්‍රජාව, ආරක්ෂිත එක් තැනක.",lead:"ජී/අප්පර් හෝමාදොල පාසල, 1 සිට 11 දක්වා ශ්‍රේණි. ප්‍රවෘත්ති, නිවේදන සහ පාසල් සේවා සිංහල සහ ඉංග්‍රීසියෙන්.",explore:"පාසල බලන්න",portal:"පිවිසුම් ද්වාරය",cap:"1 ශ්‍රේණියේ සිට 11 ශ්‍රේණිය දක්වා",

function empty(a,b){return `<div class="ph"><strong>${esc(t(a))}</strong>${esc(t(b))}</div>`}
function cards(list){return list.map(p=>`<article class="card"><h3>${esc(pick(p,"title"))}</h3><p>${esc(pick(p,"body"))}</p>${p.date?`<small>${esc(p.date)}</small>`:""}</article>`).join("")}
function renderPublic(){
 const n=posts.filter(p=>p.published&&p.type!=="event"),e=posts.filter(p=>p.published&&p.type==="event");

}
function render(){

 panel(`<h3>Exam marks</h3>${t?`<form id="mf"><div class="row"><input id="mx" placeholder="Exam name" aria-label="Exam"><select id="mt" aria-label="Term"><option>1</option><option>2</option><option>3</option></select><select id="mg" aria-label="Grade">${gopts(myG())}</select></div><div class="row" style="margin-top:.5rem"><input id="mu" placeholder="Subject" aria-label="Subject"><input id="ma" placeholder="Admission no." aria-label="Admission number"><input id="mk" type="number" min="0" max="100" placeholder="Marks" aria-label="Marks"></div><p><button class="btn p">Submit for approval</button></p></form>`:""}<p class="msg" id="pm" role="alert"></p><div id="ml">Loading…</div>`);
 const load=async()=>{try{const r=(s?await getAll("marks",W("adm","==",me.adm),W("status","==","approved")):await scoped("marks")).sort((a,b)=>(a.exam+a.subject).localeCompare(b.exam+b.subject));
  $("#ml").innerHTML=tbl(["Exam","Term","Subject","Grade","Adm","Marks","Status",""],r.map(x=>[esc(x.exam),esc(x.term),esc(x.subject),esc(x.grade),esc(x.adm),esc(x.marks),esc(x.status),staff()&&x.status!=="approved"?`<button class="btn" data-ap="${x.id}">Approve</button>`:""]))}catch{$("#ml").textContent="Could not load."}};
 load();
 $("#ml").onclick=async e=>{const b=e.target.closest("[data-ap]");if(!b)return;try{await F.fs.setDoc(dc("marks",b.dataset.ap),{status:"approved",approvedBy:me.uid,approvedAt:F.fs.serverTimestamp()},{merge:true});load()}catch{note("Could not approve.")}};
 if(t)$("#mf").onsubmit=async e=>{e.preventDefault();const o={exam:$("#mx").value.trim(),term:+$("#mt").value,grade:+$("#mg").value,subject:$("#mu").value.trim(),adm:$("#ma").value.trim(),marks:+$("#mk").value,status:"submitted",by:me.uid};
  if(!o.exam||!o.subject||!/^\d{1,8}$/.test(o.adm)||$("#mk").value===""||o.marks<0||o.marks>100)return note("Check exam, subject, admission number and marks (0–100).");
  try{await F.fs.setDoc(dc("marks",slug([o.exam,o.term,o.subject,o.adm].join("_"))),o);note("Submitted for approval.",true);load()}catch{note("Could not save. Approved marks cannot be changed.")}}},
async tt(){const ad=me.role==="admin";
 panel(`<h3>Timetable</h3>${ad?`<form id="tf"><div class="row"><select id="tg" aria-label="Grade">${gopts()}</select><select id="td" aria-label="Day">${DAYS.map(d=>`<option>${d}</option>`).join("")}</select><select id="tp" aria-label="Period">${[1,2,3,4,5,6,7,8].map(p=>`<option>${p}</option>`).join("")}</select></div><div class="row" style="margin-top:.5rem"><input id="ts2" placeholder="Subject" aria-label="Subject"><input id="tn" placeholder="Teacher name" aria-label="Teacher"></div><p><button class="btn p">Save period</button></p></form>`:""}<p class="msg" id="pm" role="alert"></p><p><button class="btn" id="pr">Print</button></p><div id="tl">Loading…</div>`);
 $("#pr").onclick=()=>print();
 const load=async()=>{try{const r=(await scoped("timetable")).sort((a,b)=>a.grade-b.grade||DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||a.period-b.period);
  $("#tl").innerHTML=tbl(["Grade","Day","Period","Subject","Teacher"],r.map(x=>[esc(x.grade),esc(x.day),esc(x.period),esc(x.subject),esc(x.teacher)]));return r}catch{$("#tl").textContent="Could not load.";return[]}};
 load();
 if(ad)$("#tf").onsubmit=async e=>{e.preventDefault();const o={grade:+$("#tg").value,day:$("#td").value,period:+$("#tp").value,subject:$("#ts2").value.trim(),teacher:$("#tn").value.trim()};if(!o.subject)return note("Enter a subject.");
  const all=await load(),c=all.find(x=>x.day===o.day&&x.period===o.period&&x.grade!==o.grade&&o.teacher&&x.teacher.toLowerCase()===o.teacher.toLowerCase());
  if(c)return note(`Conflict: ${o.teacher} is already in Grade ${c.grade} at that time.`);
  try{await F.fs.setDoc(dc("timetable",`${o.grade}_${o.day}_${o.period}`),o);note("Saved.",true);load()}catch{note("Could not save.")}}},
async lib(){const ad=me.role==="admin",st=me.role==="student";panel("<h3>Library</h3><p>Loading…</p>");
 try{const [books,loans]=await Promise.all([getAll("books"),st?getAll("loans",W("adm","==",me.adm)):ad?getAll("loans"):[]]),od=l=>!l.returned&&l.due<today();loans.sort((a,b)=>b.issued.localeCompare(a.issued));
 panel(`<h3>Library</h3>${ad?`<p>Titles: ${books.length} · Copies: ${books.reduce((a,b)=>a+b.qty,0)} · Available: ${books.reduce((a,b)=>a+b.avail,0)} · Issued: ${loans.filter(l=>!l.returned).length} · Overdue: ${loans.filter(od).length}</p>
 <form id="bf"><div class="row"><input id="bt" placeholder="Title" aria-label="Title"><input id="ba" placeholder="Author" aria-label="Author"><input id="bc" placeholder="Category" aria-label="Category"></div><div class="row" style="margin-top:.5rem"><input id="bs" placeholder="Shelf" aria-label="Shelf"><input id="bq" type="number" min="1" placeholder="Copies" aria-label="Copies"><button class="btn p">Add book</button></div></form>
 <form id="ls" style="margin-top:1rem"><div class="row"><select id="lb" aria-label="Book">${books.filter(b=>b.avail>0).map(b=>`<option value="${esc(b.id)}">${esc(b.title)}</option>`).join("")}</select><input id="la" placeholder="Admission no." aria-label="Admission number"><button class="btn p">Issue (14 days)</button></div></form>`:""}<p class="msg" id="pm" role="alert"></p>
 <h4>Books</h4>${tbl(["Title","Author","Category","Shelf","Available"],books.map(b=>[esc(b.title),esc(b.author),esc(b.category),esc(b.shelf),esc(b.avail)+"/"+esc(b.qty)]))}
 ${ad||st?`<h4>${st?"My loans":"Loans"}</h4>`+tbl(["Book","Adm","Issued","Due","Status",""],loans.map(l=>[esc(l.title),esc(l.adm),esc(l.issued),esc(l.due),l.returned?"Returned":od(l)?"OVERDUE":"Issued",ad&&!l.returned?`<button class="btn" data-r="${l.id}" data-b="${esc(l.bookId)}">Return</button>`:""])):""}`);
 if(!ad)return;
 $("#bf").onsubmit=async e=>{e.preventDefault();const q=+$("#bq").value,t=$("#bt").value.trim();if(!t||!(q>=1))return note("Enter a title and number of copies.");
  try{await F.fs.addDoc(col("books"),{title:t,author:$("#ba").value.trim(),category:$("#bc").value.trim(),shelf:$("#bs").value.trim(),qty:q,avail:q});P.lib()}catch{note("Could not add the book.")}};
 $("#ls").onsubmit=async e=>{e.preventDefault();const a=$("#la").value.trim(),bid=$("#lb").value;if(!/^\d{1,8}$/.test(a)||!bid)return note("Choose a book and enter an admission number.");
  try{if(!(await getAll("users",W("role","==","student"),W("adm","==",a))).length)return note("No student with that admission number.");
   const due=new Date(Date.now()+14*864e5).toISOString().slice(0,10);
   await F.fs.runTransaction(D,async tx=>{const r=dc("books",bid),s=await tx.get(r),n=s.data().avail;if(!(n>0))throw 0;tx.update(r,{avail:n-1});tx.set(F.fs.doc(col("loans")),{bookId:bid,title:s.data().title,adm:a,issued:today(),due,returned:false})});P.lib()}catch{note("Could not issue the book.")}};
 $("#panel").onclick=async e=>{const b=e.target.closest("[data-r]");if(!b)return;try{await F.fs.runTransaction(D,async tx=>{const r=dc("books",b.dataset.b),s=await tx.get(r);tx.update(r,{avail:s.data().avail+1});tx.update(dc("loans",b.dataset.r),{returned:true,returnedOn:today()})});P.lib()}catch{note("Could not return the book.")}};
 }catch{panel("<h3>Library</h3><p>Could not load.</p>")}}
});

/* ================= Mouse & motion effects ================= */
(()=>{
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const fine=matchMedia("(hover:hover) and (pointer:fine)").matches,mk=c=>{const d=document.createElement("div");d.className=c;d.setAttribute("aria-hidden","true");document.body.append(d);return d};
 const bar=mk("prog"),hero=$(".hero");
 addEventListener("scroll",()=>requestAnimationFrame(()=>{const h=document.documentElement;bar.style.transform=`scaleX(${Math.min(1,scrollY/Math.max(1,h.scrollHeight-innerHeight))})`}),{passive:true});
 document.addEventListener("click",e=>{const b=e.target.closest(".btn");if(!b||b.disabled)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement("span");d.className="ripple";d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.append(d);setTimeout(()=>d.remove(),650)});
 const blobs=[["-60px","12%",280],["58%","50%",220],["30%","-70px",180]].map(([l,t,s])=>{const b=document.createElement("span");b.className="blob";b.style.cssText=`left:${l};top:${t};width:${s}px;height:${s}px`;hero.prepend(b);return b});
 if(!fine)return;
 const glow=mk("glow"),ring=mk("ring");let tx=0,ty=0,gx=0,gy=0,rx=0,ry=0,on=false,tilt=null,mag=null;
 const loop=()=>{gx+=(tx-gx)*.08;gy+=(ty-gy)*.08;rx+=(tx-rx)*.25;ry+=(ty-ry)*.25;glow.style.transform=`translate(${gx}px,${gy}px)`;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(loop)};requestAnimationFrame(loop);
 document.addEventListener("pointermove",e=>{
  tx=e.clientX;ty=e.clientY;if(!on){on=true;gx=rx=tx;gy=ry=ty;glow.style.opacity=ring.style.opacity=1}
  const nx=e.clientX/innerWidth-.5,ny=e.clientY/innerHeight-.5;
  if(scrollY<hero.offsetHeight){blobs.forEach((b,i)=>{const k=(i+1)*28;b.style.setProperty("--px",`${nx*k}px`);b.style.setProperty("--py",`${ny*k}px`)});hero.style.setProperty("--sx",`${nx*-18}px`);hero.style.setProperty("--sy",`${ny*-14}px`)}
  const c=e.target.closest(".card,.grades span");
  if(c){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateY(${x*9}deg) rotateX(${-y*9}deg) translateY(-3px)`}
  if(tilt&&tilt!==c)tilt.style.transform="";tilt=c;
  const m=e.target.closest(".cta .btn");
  if(m){const r=m.getBoundingClientRect();m.style.translate=`${(e.clientX-r.left-r.width/2)*.18}px ${(e.clientY-r.top-r.height/2)*.28}px`}
  if(mag&&mag!==m)mag.style.translate="";mag=m;
  ring.classList.toggle("big",!!e.target.closest("a,button,input,select,textarea,label"));
 },{passive:true});
 document.addEventListener("mouseout",e=>{if(!e.relatedTarget){on=false;glow.style.opacity=ring.style.opacity=0}});
})();
</script>
