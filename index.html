<!DOCTYPE html>
<html lang="si" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upper Homadola Smart School — G/Upper Homadola School</title>

<style>
:root {
  --maroon: #650F2A;
  --maroon2: #800020;
  --bg: #FFFFFF;
  --surface: #F8F6F7;
  --text: #1B1418;
  --muted: #716970;
  --border: #E9DFE3;
  --ok: #21734A;
  --err: #B3324F;
  --ink: #650F2A;
  --card-bg: #FFFFFF;
  --shadow: 0 1px 3px rgba(101,15,42,.06), 0 12px 32px -12px rgba(101,15,42,.18);
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-sinhala: 'Noto Sans Sinhala', 'Inter', system-ui, sans-serif;
  --font-serif: 'Fraunces', 'Noto Sans Sinhala', serif;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #120D12;
  --surface: #1C141B;
  --text: #F4EEF1;
  --muted: #B5A9B0;
  --border: #35272F;
  --ink: #E58FA7;
  --err: #FF8DA5;
  --ok: #6FD39F;
  --card-bg: #1A131A;
  --shadow: 0 2px 6px rgba(0,0,0,.4), 0 16px 36px -12px rgba(0,0,0,.6);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 1rem/1.65 var(--font-sinhala);
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  transition: background 0.25s ease, color 0.25s ease;
}

html[lang="en"] body { font-family: var(--font-sans); }

h1, h2, h3, h4 {
  font-family: var(--font-serif);
  line-height: 1.25;
  margin: 0 0 .5em;
  color: var(--text);
}

html[lang="si"] h1, html[lang="si"] h2, html[lang="si"] h3, html[lang="si"] h4 {
  font-family: var(--font-sinhala);
  line-height: 1.45;
}

a { color: var(--ink); text-decoration: none; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }

.wrap { width: min(1140px, 100% - 2rem); margin-inline: auto; }

header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.bar {
  display: flex;
  align-items: center;
  gap: 1rem;
  min-height: 68px;
}

.brand {
  display: flex;
  align-items: center;
  gap: .75rem;
  font-weight: 700;
  color: var(--text);
  font-size: 1.05rem;
}

.mark {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--maroon), var(--maroon2));
  display: grid;
  place-items: center;
  color: #fff;
  flex-shrink: 0;
}

nav {
  margin-inline-start: auto;
  display: flex;
  align-items: center;
  gap: .35rem;
}

nav a.l {
  padding: .5rem .7rem;
  color: var(--text);
  font-size: .92rem;
  font-weight: 500;
  position: relative;
}

nav a.l::after {
  content: "";
  position: absolute;
  left: .7rem;
  right: .7rem;
  bottom: .2rem;
  height: 2px;
  background: var(--ink);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .25s ease;
}

nav a.l:hover::after { transform: scaleX(1); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  min-height: 42px;
  padding: .55rem 1.15rem;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  font-size: .92rem;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
  position: relative;
  overflow: hidden;
}

.btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.p { background: var(--maroon); border-color: var(--maroon); color: #FFFFFF; }
.btn.p:hover:not(:disabled) { background: var(--maroon2); border-color: var(--maroon2); }

#menu { display: none; }

@media(max-width: 920px) {
  #menu { display: inline-flex; margin-inline-start: auto; }
  nav {
    position: absolute;
    top: 68px;
    left: 0;
    right: 0;
    margin: 0;
    background: var(--bg);
    flex-direction: column;
    align-items: stretch;
    padding: 1.25rem;
    border-bottom: 1px solid var(--border);
    transform: translateY(-140%);
    transition: transform .3s ease;
    z-index: -1;
  }
  nav.open { transform: translateY(0); }
}

.hero {
  position: relative;
  padding: clamp(3rem, 8vw, 5.5rem) 0 3.5rem;
  background: radial-gradient(800px 420px at 85% 10%, color-mix(in srgb, var(--maroon) 12%, transparent), transparent);
  overflow: hidden;
}

.hero .wrap {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 2.5rem;
  align-items: center;
}

@media(max-width: 860px) {
  .hero .wrap { grid-template-columns: 1fr; }
}

.hero h1 {
  font-size: clamp(2rem, 5.5vw, 3.6rem);
  font-weight: 800;
  color: var(--maroon);
}

[data-theme="dark"] .hero h1 { color: #FFFFFF; }

.hero p.lead {
  color: var(--muted);
  font-size: 1.05rem;
  max-width: 52ch;
  margin: 1rem 0 1.6rem;
}

.cta { display: flex; flex-wrap: wrap; gap: .75rem; }

.steps-box {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: var(--shadow);
}

.steps {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  height: 220px;
}

.steps b {
  flex: 1;
  border-radius: 6px 6px 0 0;
  background: linear-gradient(180deg, var(--maroon2), var(--maroon));
  color: #FFFFFF;
  font: 600 .75rem/1 var(--font-sans);
  display: flex;
  justify-content: center;
  padding-top: 6px;
  height: calc(18% + var(--i) * 7.4%);
}

.cap { font-size: .85rem; color: var(--muted); margin-top: .9rem; text-align: center; }

section { padding: 3.8rem 0; }
section.alt { background: var(--surface); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1.25rem;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.4rem;
  box-shadow: var(--shadow);
  transition: transform .2s ease, box-shadow .2s ease;
}

.card:hover { box-shadow: 0 16px 36px -12px rgba(101,15,42,.28); }

.ph {
  border: 1px solid var(--border);
  background: var(--card-bg);
  border-radius: 12px;
  padding: 1.2rem;
  box-shadow: var(--shadow);
}
.ph strong { color: var(--maroon); display: block; margin-bottom: .4rem; font-size: 1.1rem; }
[data-theme="dark"] .ph strong { color: var(--ink); }
.ph p { color: var(--text); margin: 0; }

.grades {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: .75rem;
  margin: 1.5rem 0;
}

.grade-pill {
  border: 1px solid var(--border);
  background: var(--card-bg);
  border-radius: 10px;
  padding: .85rem .5rem;
  text-align: center;
  font-weight: 700;
  color: var(--maroon);
  box-shadow: var(--shadow);
  transition: transform .15s ease;
}

[data-theme="dark"] .grade-pill { color: #FFFFFF; }
.grade-pill:hover { transform: translateY(-2px); }

.notice-banner {
  padding: .85rem 1.1rem;
  background: color-mix(in srgb, var(--maroon) 6%, transparent);
  border-left: 4px solid var(--maroon);
  border-radius: 0 8px 8px 0;
  font-size: .9rem;
  color: var(--muted);
}

.gal {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: .8rem;
}

.gal figure { margin: 0; }
.gal img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid var(--border);
  display: block;
}

.gal figcaption {
  font-size: .8rem;
  color: var(--muted);
  margin-top: .4rem;
  text-align: center;
}

.reveal { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; }
.reveal.in { opacity: 1; transform: none; }

label { display: block; font-weight: 600; font-size: .9rem; margin: .8rem 0 .3rem; }
input, select, textarea {
  width: 100%;
  min-height: 44px;
  padding: .6rem .8rem;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font: inherit;
  transition: border-color .2s;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--maroon);
}

.login { max-width: 480px; margin: 0 auto; }
.msg { min-height: 1.4em; font-weight: 600; font-size: .9rem; margin: .5rem 0; }
.msg.e { color: var(--err); }
.msg.o { color: var(--ok); }

.row { display: flex; gap: .6rem; flex-wrap: wrap; }
.row > * { flex: 1; }

.tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin: 1.2rem 0; }
.tabs .btn[aria-current="true"] {
  background: var(--maroon);
  color: #FFFFFF;
  border-color: var(--maroon);
}

.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: start; padding: .65rem .75rem; border-bottom: 1px solid var(--border); }
th { background: color-mix(in srgb, var(--maroon) 5%, transparent); color: var(--text); font-weight: 700; }

.hide { display: none !important; }

footer {
  border-top: 1px solid var(--border);
  padding: 2.5rem 0;
  color: var(--muted);
  font-size: .9rem;
  background: var(--bg);
}

.prog {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  width: 100%;
  background: linear-gradient(90deg, var(--maroon), var(--maroon2));
  transform: scaleX(0);
  transform-origin: left;
  z-index: 60;
  pointer-events: none;
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
  .reveal { opacity: 1; transform: none; }
}

@media print {
  header, footer, .tabs, .btn, #out, .hero, section:not(#login) { display: none !important; }
}
</style>

<style>

[data-theme="dark"] .ph, [data-theme="dark"] .card, [data-theme="dark"] .song {

.btn.p:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #3d0919, 0 4px 10px -4px rgba(101,15,42,.5); }

section h2 { font-size: clamp(1.6rem, 3.5vw, 2.3rem); }
section h2::after { content: ""; display: block; width: 56px; height: 4px; border-radius: 4px; margin-top: .55rem; background: linear-gradient(90deg, var(--maroon), var(--maroon2)); }

/* Hero: floating 3D bars + orbs */
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35; animation: drift 14s ease-in-out infinite alternate; pointer-events: none; }
.hero::before { width: 360px; height: 360px; background: var(--maroon2); left: -80px; top: 20px; }
.hero::after { width: 300px; height: 300px; background: #c9577a; right: 10%; bottom: -80px; animation-delay: -6s; }
@keyframes drift { to { transform: translate(60px, 40px) scale(1.15); } }
.hero .wrap { position: relative; z-index: 2; }
.steps { transform: perspective(800px) rotateX(10deg) rotateY(-16deg); transform-style: preserve-3d; }
.steps b { box-shadow: 5px 0 0 rgba(0,0,0,.28), 0 16px 20px -8px rgba(101,15,42,.6); animation: bob 4s ease-in-out infinite; animation-delay: calc(var(--i) * .15s); }
@keyframes bob { 50% { translate: 0 -8px; } }

/* Hero background video */
.hv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; }
.hv-shade { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s; background: linear-gradient(120deg, rgba(30,4,14,.85), rgba(101,15,42,.45)); }
.hero.has-video .hv, .hero.has-video .hv-shade { opacity: 1; }
.hero.has-video::before, .hero.has-video::after { display: none; }
.hero.has-video h1 { color: #fff; }
.hero.has-video p.lead { color: rgba(255,255,255,.9); }
.hero.has-video .btn:not(.p) { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.4); backdrop-filter: blur(6px); }

/* Logo */
.mark.has-logo { background: #fff; padding: 3px; }
.mark img { width: 100%; height: 100%; object-fit: contain; }
.hlogo { width: 92px; height: 92px; object-fit: contain; border-radius: 24px; background: #fff; padding: 8px; margin-bottom: 1.1rem; box-shadow: 0 22px 34px -12px rgba(0,0,0,.45); animation: bob 5s ease-in-out infinite; }

/* School song */
.song { display: grid; grid-template-columns: 220px 1fr; gap: 2rem; align-items: center; padding: 2rem; border: 1px solid var(--border); }
@media (max-width: 720px) { .song { grid-template-columns: 1fr; } }
.disc { width: 200px; aspect-ratio: 1; border-radius: 50%; margin: auto; position: relative; background: repeating-radial-gradient(circle, #1a0a12 0 3px, #2b1321 3px 6px); box-shadow: 0 26px 40px -12px rgba(0,0,0,.55), inset 0 0 0 4px rgba(255,255,255,.06); }
.disc span { position: absolute; inset: 33%; border-radius: 50%; background: linear-gradient(135deg, var(--maroon), var(--maroon2)) center/cover; box-shadow: 0 0 0 4px rgba(255,255,255,.12); }
.disc.spin { animation: spin 5s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.song audio { width: 100%; margin-top: .8rem; }
.lyrics { white-space: pre-line; max-height: 280px; overflow: auto; padding: 1rem 1.2rem; margin-top: 1rem; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); line-height: 1.95; }

/* Entrance animation (scroll-driven where supported) */

#newsList .card, #evList .card, .gal figure, .ph, .song { animation: rise .7s ease both; }
@supports (animation-timeline: view()) {
  #newsList .card, #evList .card, .gal figure, .ph, .song { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 35%; }
}
@media (prefers-reduced-motion: reduce) {
  .hero::before, .hero::after, .steps b, .hlogo, .disc.spin { animation: none !important; }

<script type="module">
const CFG = {
  firebase: {
    apiKey: "AIzaSyAtJmvP91wY2pToErARMdcSwpJ2ftVYaCM",
    authDomain: "uhkv-53eb9.firebaseapp.com",
    projectId: "uhkv-53eb9",
    storageBucket: "uhkv-53eb9.firebasestorage.app",
    messagingSenderId: "191585546232",
    appId: "1:191585546232:web:b289c3321319c6eb4af00d",
    measurementId: "G-FQNP6GWS6D"
  },
  imgbbKey: "bc81d388ab05868ad68ff92d859a7cd7"
};
const $ = s => document.querySelector(s), root = document.documentElement;
const ok = u => { try { return new URL(u).protocol === "https:"; } catch { return false; } };
const lang = () => root.lang === "en" ? "en" : "si";
const TXT = {
  en: { song: "School Song", none: "The school song will appear here once published.", nol: "Lyrics will be added soon." },
  si: { song: "පාසල් ගීතය", none: "පාසල් ගීතය පළ කළ පසු මෙහි දිස්වනු ඇත.", nol: "පද රචනය ඉක්මනින් එක් කරනු ඇත." }
};

/* ---- inject DOM ---- */
const hero = $(".hero"), mark = $(".mark"), mark0 = mark.innerHTML;
hero.insertAdjacentHTML("afterbegin", '<video id="hv" class="hv" muted loop playsinline autoplay></video><div class="hv-shade"></div>');
hero.querySelector(".wrap > div").insertAdjacentHTML("afterbegin", '<img id="hl" class="hlogo" alt="School logo" hidden>');
$("#about").insertAdjacentHTML("afterend", '<section id="song"><div class="wrap"><h2 id="sh"></h2><div class="song" id="sb"></div></div></section>');
$('a.l[href="#about"]').insertAdjacentHTML("afterend", '<a class="l" id="ns" href="#song"></a>');

let C = {}, songSrc = "";
function paint() {
  const l = lang(), t = TXT[l], p = k => C[k + "_" + l] || C[k + "_en"] || C[k + "_si"] || "";
  $("#ns").textContent = $("#sh").textContent = t.song;

  const hv = $("#hv"), vid = ok(C.hero_video);

    a.onplay = () => $("#disc").classList.add("spin");

  if (logo) $("#dl").style.backgroundImage = `url("${C.logo_url.replace(/"/g, "")}")`;
  $("#stt").textContent = p("song_title") || t.song;
  $("#sly").textContent = p("lyrics") || t.nol;

new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ["lang"] });
paint();

/* ---- 3D tilt ---- */
if (matchMedia("(hover:hover)").matches && !matchMedia("(prefers-reduced-motion:reduce)").matches) {
  const SEL = ".ph,.steps-box,#newsList .card,#evList .card,.song,.gal figure"; let cur;
  addEventListener("pointermove", e => {
    const el = e.target.closest?.(SEL);
    if (cur && cur !== el) { cur.style.setProperty("--rx", "0deg"); cur.style.setProperty("--ry", "0deg"); }

    const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    el.style.setProperty("--ry", (x * 10).toFixed(1) + "deg"); el.style.setProperty("--rx", (-y * 10).toFixed(1) + "deg");
  }, { passive: true });
}

/* ---- Firebase: load media settings, admin editor ---- */
try {
  const B = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [app, fs] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-firestore.js")]);
  const D = fs.getFirestore(app.initializeApp(CFG.firebase)), ref = fs.doc(D, "cms", "home");
  try { C = (await fs.getDoc(ref)).data() || {}; paint(); } catch {}

  const card = () => `
    <div class="card" id="uxCard">

  const i = new Image();
  i.onload = () => {
    const s = Math.min(1, 1600 / Math.max(i.width, i.height)), c = document.createElement("canvas");

/* ================= FIREBASE INITIALIZATION ================= */
const ON = !!CFG.firebase.apiKey;
let F, A, D, me = null;

if (!ON) {
  $("#cfgMsg").textContent = t("off");
  $("#cfgMsg").className = "msg e";
  $("#lbtn").disabled = true;
} else {
  boot();
}

async function boot() {
  const V = "10.12.2", B = `https://www.gstatic.com/firebasejs/${V}/`;
  try {
    const [app, au, fs] = await Promise.all([
      import(B + "firebase-app.js"),
      import(B + "firebase-auth.js"),
      import(B + "firebase-firestore.js")
    ]);
    F = { app, au, fs };
    const a = app.initializeApp(CFG.firebase);
    A = au.getAuth(a);
    D = fs.getFirestore(a);

    // Load CMS Data & Public Posts
    await loadCMS();
    loadPublic();

    au.onAuthStateChanged(A, async u => {
      if (!u) {
        me = null;
        $("#app").classList.add("hide");
        $("#loginBox").classList.remove("hide");
        return;
      }
      try {
        const s = await fs.getDoc(fs.doc(D, "users", u.uid));
        if (!s.exists() || s.data().active === false) {
          await au.signOut(A);
          $("#lerr").textContent = t("bad");
          return;
        }
        me = { uid: u.uid, ...s.data() };
        showApp();
      } catch(err) {
        await au.signOut(A);
      }
    });
  } catch(err) {
    $("#cfgMsg").textContent = "Error loading secure authentication components.";
    $("#cfgMsg").className = "msg e";
  }
}

async function loadCMS() {
  try {
    const snap = await F.fs.getDoc(F.fs.doc(D, "cms", "home"));
    if (snap.exists()) {
      CMS = { ...CMS, ...snap.data() };
      render();
    }
  } catch(e) {
    console.warn("Could not load dynamic CMS, using defaults.");
  }
}

async function loadPublic() {
  try {
    const q = await F.fs.getDocs(F.fs.query(F.fs.collection(D, "posts"), F.fs.orderBy("createdAt", "desc"), F.fs.limit(30)));
    posts = q.docs.map(d => d.data());
    const g = await F.fs.getDocs(F.fs.query(F.fs.collection(D, "gallery"), F.fs.orderBy("createdAt", "desc"), F.fs.limit(40)));
    gal = g.docs.map(d => d.data());
    renderPublic();
  } catch(e) {}
}

/* Map Username to Hidden Internal Firebase Email Alias */
function alias(raw) {
  const u = raw.trim().toUpperCase().replace(/\s/g, "");
  let prefix;
  if (u === "ADMIN") prefix = "admin";
  else if (/^(\d{9}[VX]|\d{12})$/.test(u)) prefix = "t" + u.toLowerCase();
  else if (/^\d{1,8}$/.test(u)) prefix = "s" + u;
  else return null;
  return `${prefix}@${CFG.domain}`;
}

$("#lf").onsubmit = async e => {
  e.preventDefault();
  $("#lerr").textContent = "";
  if (!ON) return;
  const em = alias($("#u").value), pw = $("#p").value;
  if (!em || !pw) { $("#lerr").textContent = t("bad"); return; }
  
  $("#lbtn").disabled = true;
  try {
    await F.au.signInWithEmailAndPassword(A, em, pw);
  } catch(err) {
    $("#lerr").textContent = t("bad");
  }
  $("#lbtn").disabled = false;
  $("#p").value = "";
};

  if (!CFG.imgbbKey || !/^image\/(jpeg|png|webp)$/.test(f.type) || f.size > 5e6) throw new Error("Invalid image format or size > 5MB");
  const fd = new FormData();
  fd.append("image", f);

};

const rnd = max => {
  const lim = 256 - (256 % max), b = new Uint8Array(1);
  do { crypto.getRandomValues(b); } while (b[0] >= lim);
  return b[0] % max;
};

const genPw = () => {
  let s = "";
  for (let i = 0; i < 2; i++) s += String.fromCharCode(65 + rnd(26));
  for (let i = 0; i < 4; i++) s += rnd(10);
  return s;
};

  /* 3. Account Creation */
  create() {
    panel(`
      <h3>Create New Academic Account</h3>
      <form id="cf">
        <label for="ct">Account Role</label>
        <select id="ct">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>

        <label for="cid">Admission Number (Student) or NIC (Teacher)</label>
        <input id="cid" autocomplete="off" placeholder="e.g. 1052 or 198512345678" required>

        <label for="cn">Full Legal Name</label>
        <input id="cn" required placeholder="Name with initials">

        <label for="cg">Grade (e.g. 7 for student, or 6,7,8 for teacher)</label>
        <input id="cg" required placeholder="Grades 1 to 11">

        <label for="cp">Cryptographic Initial Password</label>
        <div class="row">
          <input id="cp" type="password" autocomplete="new-password" readonly required>
          <button class="btn" type="button" id="gen">Generate</button>
          <button class="btn" type="button" id="sh">Show</button>
        </div>

        <p class="msg" id="pm" role="alert"></p>
        <button class="btn p" type="submit" style="margin-top:.8rem;">Confirm & Provision Account</button>
      </form>
    `);

    $("#gen").onclick = () => { $("#cp").value = genPw(); };
    $("#sh").onclick = () => {
      const p = $("#cp");
      p.type = p.type === "password" ? "text" : "password";
      $("#sh").textContent = p.type === "password" ? "Show" : "Hide";
    };

    $("#cf").onsubmit = async e => {
      e.preventDefault();
      const type = $("#ct").value;
      const raw = $("#cid").value.trim().toUpperCase().replace(/\s/g, "");
      const name = $("#cn").value.trim();
      const g = $("#cg").value.trim();
      const pw = $("#cp").value;

      const okId = type === "student" ? /^\d{1,8}$/.test(raw) : /^(\d{9}[VX]|\d{12})$/.test(raw);
      const grades = g.split(",").map(x => +x.trim()).filter(x => x >= 1 && x <= 11);

      if (!okId) return note("Invalid format: Admission must be 1-8 digits, NIC must be valid Sri Lankan format.");
      if (name.length < 2) return note("Please provide the full name.");
      if (!grades.length) return note("Provide valid grade(s) between 1 and 11.");
      if (!pw) return note("Click Generate to generate a secure random password.");
      if (type === "student" && pw === raw) return note("Password must not equal the admission number.");

      note("Provisioning credential...", true);
      let secApp;
      try {
        const em = alias(raw);
        secApp = F.app.initializeApp(CFG.firebase, "sec_" + Date.now());
        const secAuth = F.au.getAuth(secApp);
        const cr = await F.au.createUserWithEmailAndPassword(secAuth, em, pw);
        await F.au.signOut(secAuth);

        const base = {
          role: type,
          name,
          active: true,
          mustChangePassword: true,
          createdAt: F.fs.serverTimestamp(),
          createdBy: me.uid
        };

        if (type === "student") {
          await F.fs.setDoc(dc("users", cr.user.uid), {
            ...base,
            adm: raw,
            grade: grades[0],
            societies: [],
            extracurricular: [],
            awards: []
          });
        } else {
          const teacherSeqId = await F.fs.runTransaction(D, async tx => {
            const counterRef = dc("counters", "teachers");
            const snap = await tx.get(counterRef);
            const nextVal = ((snap.data()?.n || 0) + 1);
            tx.set(counterRef, { n: nextVal });
            return "TCH-" + String(nextVal).padStart(4, "0");
          });

          await F.fs.setDoc(dc("users", cr.user.uid), {
            ...base,
            teacherId: teacherSeqId,
            nicMasked: raw.slice(0, 3) + "******" + raw.slice(-2),
            grades
          });
        }

        note(`Account created. Copy password now (shown once): ${pw}`, true);
        $("#cp").value = "";
        $("#cp").type = "text";
        $("#cf").reset();
      } catch(err) {
        note(err.code === "auth/email-already-in-use" ? "This Admission Number or NIC already exists." : "Account provision failed: " + err.message);
      } finally {
        try { if (secApp) await F.app.deleteApp(secApp); } catch {}
      }
    };
  },

    const isTeacher = me.role === "teacher";
    panel(`
      <h3>Authorized Student Password Reset</h3>
      <p style="color:var(--muted)">Reset credentials for enrolled students in your assigned grade(s).</p>
      <form id="rf">
        <label for="radm">Student Admission Number</label>

      e.preventDefault();
      const adm = $("#radm").value.trim();
      if (!/^\d{1,8}$/.test(adm)) return note("Enter a valid admission number.");

      note("Verifying assignment...", true);
      try {
        const q = await F.fs.getDocs(F.fs.query(col("users"), W("role", "==", "student"), W("adm", "==", adm)));

      return panel(`

        <input id="ad" type="date" value="${today()}" aria-label="Date">

      if (me.role === "teacher" && (new Date(today()) - new Date(d)) / 864e5 > 3) {
        return note("Attendance editing window restricted to the last 3 days.");
      }

      try {
        const [s, ex] = await Promise.all([
          getAll("users", W("role", "==", "student"), W("grade", "==", g)),
          getAll("attendance", W("grade", "==", g), W("date", "==", d))
        ]);
        const m = Object.fromEntries(ex.map(x => [x.adm, x.status]));

        $("#ab").innerHTML = s.length ? tbl(
          ["Admission No", "Student Name", "Status"],
          s.map(x => [

            `<select data-a="${esc(x.adm)}" data-n="${esc(x.name)}" aria-label="Status">

          ])

        if (s.length) {

              document.querySelectorAll("[data-a]").forEach(e => {
                b.set(dc("attendance", `${d}_${e.dataset.a}`), {
                  date: d,
                  grade: g,
                  adm: e.dataset.a,
                  name: e.dataset.n,
                  status: e.value,
                  by: me.uid,
                  byName: me.name || "Teacher"
                });
              });
              await b.commit();
              note("Attendance entries successfully recorded.", true);
            } catch(err) {
              note("Error saving records: " + err.message);
            }
          };
        }
      } catch(err) {
        note("Could not load student roster: " + err.message);
      }
    };
  },

            <select id="tg" aria-label="Grade">${gopts()}</select>
            <select id="td" aria-label="Day">${DAYS.map(d => `<option value="${d}">${d}</option>`).join("")}</select>
            <select id="tp" aria-label="Period">${[1,2,3,4,5,6,7,8].map(p => `<option value="${p}">Period ${p}</option>`).join("")}</select>
          </div>
          <div class="row" style="margin-top:.5rem;">
            <input id="ts2" placeholder="Subject" required aria-label="Subject">
            <input id="tn" placeholder="Teacher Name" required aria-label="Teacher">
          </div>
          <p class="msg" id="pm" role="alert"></p>
          <button class="btn p" style="margin-top:.6rem;">Save Period</button>
        </form>
      ` : '<p class="msg" id="pm" role="alert"></p>'}
      <p><button class="btn" id="pr">🖨️ Print Timetable</button></p>
      <div id="tl">Loading periods...</div>
    `);

    $("#pr").onclick = () => window.print();

    const load = async () => {
      try {
        let r = [];
        if (staff()) r = await getAll("timetable");
        else if (me.role === "student") r = await getAll("timetable", W("grade", "==", +me.grade));
        else r = (await Promise.all(me.grades.map(g => getAll("timetable", W("grade", "==", g))))).flat();

        r.sort((a,b) => a.grade - b.grade || DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || a.period - b.period);

        $("#tl").innerHTML = tbl(
          ["Grade", "Day", "Period", "Subject", "Teacher"],
          r.map(x => [`Grade ${esc(x.grade)}`, esc(x.day), `P${esc(x.period)}`, esc(x.subject), esc(x.teacher)])
        );
        return r;
      } catch(err) {
        $("#tl").textContent = "Could not load timetable schedules.";
        return [];
      }
    };

    load();

    if (isAdmin) {
      $("#tf").onsubmit = async e => {
        e.preventDefault();
        const o = {
          grade: +$("#tg").value,
          day: $("#td").value,
          period: +$("#tp").value,
          subject: $("#ts2").value.trim(),
          teacher: $("#tn").value.trim()
        };

        const all = await load();
        const conflict = all.find(x => x.day === o.day && x.period === o.period && x.grade !== o.grade && o.teacher && x.teacher.toLowerCase() === o.teacher.toLowerCase());
        if (conflict) {
          return note(`Scheduling Conflict: ${o.teacher} is already assigned to Grade ${conflict.grade} during ${o.day} Period ${o.period}.`);
        }

        try {
          await F.fs.setDoc(dc("timetable", `${o.grade}_${o.day}_${o.period}`), o);
          note("Timetable period saved.", true);
          load();
        } catch(err) {
          note("Save failed: " + err.message);
        }
      };
    }
  },

  /* 9. Library */
  async lib() {
    const isAdmin = me.role === "admin";
    const isStudent = me.role === "student";
    panel("<h3>School Library Resource System</h3><p>Loading catalog...</p>");

    try {
      const [books, loans] = await Promise.all([
        getAll("books"),
        isStudent ? getAll("loans", W("adm", "==", me.adm)) : isAdmin ? getAll("loans") : []
      ]);

      const isOverdue = l => !l.returned && l.due < today();
      loans.sort((a,b) => b.issued.localeCompare(a.issued));

      panel(`
        <h3>School Library Resource System</h3>
        ${isAdmin ? `
          <div class="ph" style="margin-bottom:1.5rem;background:var(--card-bg);">
            <strong>Library Inventory Statistics</strong>
            Cataloged Titles: ${books.length} • Total Volume Stock: ${books.reduce((a,b) => a + (b.qty||0), 0)} • Circulating Copies Available: ${books.reduce((a,b) => a + (b.avail||0), 0)} • Currently Issued: ${loans.filter(l => !l.returned).length} • Overdue Loans: ${loans.filter(isOverdue).length}
          </div>

          <form id="bf" class="card" style="margin-bottom:1.2rem;">
            <h4 style="margin:0 0 .5rem;">Catalog New Volume</h4>
            <div class="row">
              <input id="bt" placeholder="Book Title" required aria-label="Title">
              <input id="ba" placeholder="Author" required aria-label="Author">
              <input id="bc" placeholder="Category" aria-label="Category">
            </div>
            <div class="row" style="margin-top:.5rem;">
              <input id="bs" placeholder="Shelf Location" aria-label="Shelf">
              <input id="bq" type="number" min="1" value="1" placeholder="Quantity" required aria-label="Copies">
              <button class="btn p">Add to Catalog</button>
            </div>
          </form>

          <form id="ls" class="card" style="margin-bottom:1.5rem;">
            <h4 style="margin:0 0 .5rem;">Circulate / Issue Volume (14-Day Lending)</h4>
            <div class="row">
              <select id="lb" aria-label="Select Book">
                ${books.filter(b => b.avail > 0).map(b => `<option value="${esc(b.id)}">${esc(b.title)} (${esc(b.avail)} available)</option>`).join("")}
              </select>
              <input id="la" placeholder="Student Admission Number" required aria-label="Admission">
              <button class="btn p">Issue Book</button>
            </div>
          </form>
        ` : ""}
        <p class="msg" id="pm" role="alert"></p>

        <h4>Cataloged Volumes</h4>
        ${tbl(["Title", "Author", "Category", "Shelf", "Availability"], books.map(b => [esc(b.title), esc(b.author), esc(b.category), esc(b.shelf), `${esc(b.avail)} / ${esc(b.qty)}`]))}

        ${isAdmin || isStudent ? `
          <h4 style="margin-top:1.5rem;">${isStudent ? "My Borrowing History" : "Active Lending Circulation"}</h4>
          ${tbl(
            ["Title", "Borrower Adm", "Issue Date", "Due Date", "Status", "Action"],
            loans.map(l => [
              esc(l.title),
              esc(l.adm),
              esc(l.issued),
              esc(l.due),
              l.returned ? "<span class='msg o'>Returned</span>" : isOverdue(l) ? "<span class='msg e'>OVERDUE</span>" : "Borrowed",
              isAdmin && !l.returned ? `<button class="btn" data-r="${l.id}" data-b="${esc(l.bookId)}">Mark Returned</button>` : "—"
            ])
          )}
        ` : ""}
      `);

      if (!isAdmin) return;

      $("#bf").onsubmit = async e => {
        e.preventDefault();
        const q = +$("#bq").value, t = $("#bt").value.trim();
        if (!t || q < 1) return note("Provide a title and valid stock quantity.");
        try {
          await F.fs.addDoc(col("books"), {
            title: t,
            author: $("#ba").value.trim(),
            category: $("#bc").value.trim(),
            shelf: $("#bs").value.trim(),
            qty: q,
            avail: q,
            createdAt: F.fs.serverTimestamp()
          });
          P.lib();
        } catch(err) {
          note("Catalog error: " + err.message);
        }
      };

      $("#ls").onsubmit = async e => {
        e.preventDefault();
        const a = $("#la").value.trim(), bid = $("#lb").value;
        if (!/^\d{1,8}$/.test(a) || !bid) return note("Select a volume and enter a valid admission number.");

        try {
          const userCheck = await getAll("users", W("role", "==", "student"), W("adm", "==", a));
          if (!userCheck.length) return note("Admission number does not match an enrolled student.");

          const due = new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10);
          await F.fs.runTransaction(D, async tx => {
            const bRef = dc("books", bid);
            const bSnap = await tx.get(bRef);
            const n = bSnap.data().avail;
            if (n <= 0) throw new Error("No circulating copies remaining.");
            tx.update(bRef, { avail: n - 1 });
            tx.set(F.fs.doc(col("loans")), {
              bookId: bid,
              title: bSnap.data().title,
              adm: a,
              issued: today(),
              due,
              returned: false
            });
          });
          P.lib();
        } catch(err) {
          note("Lending transaction failed: " + err.message);
        }
      };

      $("#panel").onclick = async e => {
        const btnReturn = e.target.closest("[data-r]");
        if (!btnReturn) return;
        try {
          await F.fs.runTransaction(D, async tx => {
            const bRef = dc("books", btnReturn.dataset.b);
            const bSnap = await tx.get(bRef);
            tx.update(bRef, { avail: (bSnap.data()?.avail || 0) + 1 });
            tx.update(dc("loans", btnReturn.dataset.r), { returned: true, returnedOn: today() });
          });
          P.lib();
        } catch(err) {
          note("Return transaction error: " + err.message);
        }
      };
    } catch(err) {
      panel("<h3>Library Module</h3><p>Could not load database records.</p>");
    }
  },

  /* 10. Question Bank */
  async qb() {
    const isAdmin = me.role === "admin";
    panel(`
      <h3>Academic Question Bank & Materials</h3>
      ${isAdmin ? `
        <form id="qf" class="card" style="margin-bottom:1.5rem;">
          <h4 style="margin:0 0 .5rem;">Upload Academic Resource</h4>
          <div class="row">
            <select id="qg" aria-label="Grade">${gopts()}</select>
            <input id="qs" placeholder="Subject" required aria-label="Subject">
          </div>
          <input id="qt" placeholder="Resource Title / Exam Term" required aria-label="Title" style="margin-top:.5rem;">
          <input id="qu" placeholder="Verified Google Drive PDF Link (https://drive.google.com/...)" required aria-label="Drive link" style="margin-top:.5rem;">
          <p class="msg" id="pm" role="alert"></p>
          <button class="btn p" style="margin-top:.6rem;">Publish Resource</button>
        </form>
      ` : ""}
      <p style="margin:1rem 0;">
        <a class="btn" href="https://quizhub.lk/" target="_blank" rel="noopener noreferrer">🌐 Open External QuizHub Portal</a>
      </p>
      <div id="ql">Loading repository...</div>
    `);

    const load = async () => {
      try {
        const s = await F.fs.getDocs(F.fs.query(col("qbank"), F.fs.orderBy("createdAt", "desc"), F.fs.limit(100)));
        const r = s.docs.map(d => d.data()).filter(x => driveOk(x.url) && (staff() || me.role === "teacher" || +x.grade === +me.grade));
        $("#ql").innerHTML = tbl(
          ["Grade", "Subject", "Title", "Resource Access"],
          r.map(x => [`Grade ${esc(x.grade)}`, esc(x.subject), esc(x.title), `<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">View PDF</a>`])
        );
      } catch(err) {
        $("#ql").textContent = "Could not load resources.";
      }
    };

    load();

    if (isAdmin) {
      $("#qf").onsubmit = async e => {
        e.preventDefault();
        const g = +$("#qg").value, u = $("#qu").value.trim(), ti = $("#qt").value.trim();
        if (!(g >= 1 && g <= 11) || !ti || !driveOk(u)) return note("Provide grade 1-11, title, and valid Google Drive URL.");
        try {
          await F.fs.addDoc(col("qbank"), {
            grade: g,
            subject: $("#qs").value.trim(),
            title: ti,
            url: u,
            createdAt: F.fs.serverTimestamp()
          });
          note("Academic resource uploaded.", true);
          $("#qf").reset();
          load();
        } catch(err) {
          note("Upload failed: " + err.message);
        }
      };
    }
  },

  /* 11. Notices & News */
  post() {
    panel(`
      <h3>Publish Notices & News</h3>
      <form id="pf">
        <label for="pt">Category</label>
        <select id="pt">
          <option value="news">School News</option>
          <option value="notice">Official Notice</option>
          <option value="event">Upcoming Event</option>
        </select>
        <div class="row">
          <div><label for="te">English Title</label><input id="te"></div>
          <div><label for="ts">Sinhala Title</label><input id="ts"></div>
        </div>
        <div class="row">
          <div><label for="be">English Body</label><textarea id="be" rows="3"></textarea></div>
          <div><label for="bs">Sinhala Body</label><textarea id="bs" rows="3"></textarea></div>
        </div>
        <label for="pd">Scheduled Date (For Events)</label>
        <input id="pd" type="date">
        <p class="msg" id="pm" role="alert"></p>
        <button class="btn p" style="margin-top:.8rem;">Publish to Public Website</button>
      </form>
    `);

    $("#pf").onsubmit = async e => {
      e.preventDefault();
      const o = {
        type: $("#pt").value,
        title_en: $("#te").value.trim(),
        title_si: $("#ts").value.trim(),
        body_en: $("#be").value.trim(),
        body_si: $("#bs").value.trim(),
        date: $("#pd").value,
        published: true,
        createdAt: F.fs.serverTimestamp(),
        author: me.uid
      };
      if (!o.title_en && !o.title_si) return note("Provide a title in at least one language.");

      try {
        await F.fs.addDoc(col("posts"), o);
        note("Item successfully published.", true);
        $("#pf").reset();
        loadPublic();
      } catch(err) {
        note("Could not publish post.");
      }
    };
  },

  /* 12. Gallery CMS */
  gal() {
    panel(`
      <h3>Photo Gallery Manager</h3>
      <p style="color:var(--muted)">Images are hosted via secure ImgBB CDN. Max file size: 5MB.</p>
      <form id="gf">
        <label for="gf1">Select Image File (JPG, PNG, WebP)</label>
        <input id="gf1" type="file" accept="image/jpeg,image/png,image/webp" required>
        <label for="gt">Image Caption</label>
        <input id="gt" placeholder="Description of the event or activity">
        <p class="msg" id="pm" role="alert"></p>
        <button class="btn p" style="margin-top:.8rem;">Upload & Publish</button>
      </form>
    `);

    $("#gf").onsubmit = async e => {
      e.preventDefault();
      const file = $("#gf1").files[0];
      if (!CFG.imgbbKey) return note("ImgBB API key is missing in CFG.");
      if (!file) return note("Choose an image file.");

      note("Uploading file...", true);
      try {
        const url = await ibbUp(file);
        await F.fs.addDoc(col("gallery"), {
          url,
          title: $("#gt").value.trim(),
          createdAt: F.fs.serverTimestamp(),
          by: me.uid
        });
        note("Photograph uploaded.", true);
        $("#gf").reset();
        loadPublic();
      } catch(err) {
        note("Upload failed: " + err.message);
      }
    };
  },

  /* 13. User Directory */
  async users() {
    panel("<h3>Registered Academic Users</h3><div id='ul'>Loading accounts...</div>");
    try {
      const s = await F.fs.getDocs(F.fs.query(col("users"), F.fs.limit(250)));
      $("#ul").innerHTML = tbl(
        ["Full Name", "Role", "Identifier", "Grade Scope", "Status"],
        s.docs.map(d => d.data()).map(u => [
          esc(u.name),
          esc(u.role),
          esc(u.adm || u.teacherId || u.nicMasked || "Staff"),
          esc(u.grade ? `Grade ${u.grade}` : (u.grades || []).join(", ") || "—"),
          u.active !== false ? "<span class='msg o'>Active</span>" : "<span class='msg e'>Disabled</span>"
        ])
      );
    } catch(err) {
      $("#ul").textContent = "Could not load user accounts.";
    }
  },

  /* 14. Account Settings */
  acct() {
    panel(`
      <h3>Security & Password Management</h3>
      <form id="af">
        <label for="op">Current Password</label>
        <input id="op" type="password" autocomplete="current-password" required>
        <label for="np">New Password (Minimum 10 Characters)</label>
        <input id="np" type="password" autocomplete="new-password" required>
        <p class="msg" id="pm" role="alert"></p>
        <button class="btn p" style="margin-top:.8rem;">Update Password</button>
      </form>
    `);

    $("#af").onsubmit = async e => {
      e.preventDefault();
      const np = $("#np").value;
      if (np.length < 10) return note("Password length must be at least 10 characters.");

      try {
        const u = A.currentUser;
        const cred = F.au.EmailAuthProvider.credential(u.email, $("#op").value);
        await F.au.reauthenticateWithCredential(u, cred);
        await F.au.updatePassword(u, np);
        await F.fs.setDoc(dc("users", u.uid), { mustChangePassword: false }, { merge: true });
        note("Your password has been updated.", true);
        $("#af").reset();
      } catch(err) {
        note("Authentication error: Verify current password.");
      }
    };
  }
};
</script>
</body>
</html>
