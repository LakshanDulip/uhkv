<!DOCTYPE html>
<html lang="si" data-theme="light">
<head>
<meta charset="utf-8">

<style>
:root {
  --maroon: #650F2A;
  --maroon2: #800020;
  --bg: #FFFFFF;
  --surface: #F8F6F7;
  --text: #1B1418;
  --muted: #716970;
  --border: #E9DFE3;
  --ok: #21734A;
  --err: #B3324F;
  --ink: #650F2A;
  --card-bg: #FFFFFF;
  --shadow: 0 1px 3px rgba(101,15,42,.06), 0 12px 32px -12px rgba(101,15,42,.18);
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-sinhala: 'Noto Sans Sinhala', 'Inter', system-ui, sans-serif;
  --font-serif: 'Fraunces', 'Noto Sans Sinhala', serif;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #120D12; --surface: #1C141B; --text: #F4EEF1; --muted: #B5A9B0;
  --border: #35272F; --ink: #E58FA7; --err: #FF8DA5; --ok: #6FD39F;
  --card-bg: #1A131A;
  --shadow: 0 2px 6px rgba(0,0,0,.4), 0 16px 36px -12px rgba(0,0,0,.6);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 1rem/1.65 var(--font-sinhala);
  overflow-x: hidden; padding-top: env(safe-area-inset-top, 0px);
  transition: background 0.25s ease, color 0.25s ease;
}
html[lang="en"] body { font-family: var(--font-sans); }
h1,h2,h3,h4 { font-family: var(--font-serif); line-height: 1.25; margin: 0 0 .5em; color: var(--text); }
html[lang="si"] h1, html[lang="si"] h2, html[lang="si"] h3, html[lang="si"] h4 { font-family: var(--font-sinhala); line-height: 1.45; }
a { color: var(--ink); text-decoration: none; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
.wrap { width: min(1140px, 100% - 2rem); margin-inline: auto; }

header {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.bar { display: flex; align-items: center; gap: 1rem; min-height: 68px; }
.brand { display: flex; align-items: center; gap: .75rem; font-weight: 700; color: var(--text); font-size: 1.05rem; }
.mark {
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, var(--maroon), var(--maroon2));
  display: grid; place-items: center; color: #fff; flex-shrink: 0; overflow: hidden;
}
.mark.has-logo { background: #fff; padding: 3px; border: 1px solid var(--border); }
.mark img { width: 100%; height: 100%; object-fit: contain; }

nav { margin-inline-start: auto; display: flex; align-items: center; gap: .35rem; }
nav a.l { padding: .5rem .65rem; color: var(--text); font-size: .9rem; font-weight: 500; position: relative; }
nav a.l::after {
  content: ""; position: absolute; left: .65rem; right: .65rem; bottom: .2rem; height: 2px;
  background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform .25s ease;
}
nav a.l:hover::after { transform: scaleX(1); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  min-height: 42px; padding: .55rem 1.15rem; border-radius: 9px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer;
  transition: transform .15s ease, box-shadow .2s ease; position: relative; overflow: hidden;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.p {
  background: linear-gradient(180deg, var(--maroon2), var(--maroon));
  border-color: var(--maroon); color: #FFFFFF;
  box-shadow: 0 4px 0 #3d0919, 0 12px 22px -8px rgba(101,15,42,.45);
}
#menu { display: none; }
@media(max-width: 980px) {
  #menu { display: inline-flex; margin-inline-start: auto; }
  nav {
    position: absolute; top: 68px; left: 0; right: 0; margin: 0; background: var(--bg);
    flex-direction: column; align-items: stretch; padding: 1.25rem; border-bottom: 1px solid var(--border);
    transform: translateY(-140%); transition: transform .3s ease; z-index: -1;
  }
  nav.open { transform: translateY(0); }
}

.hero {
  position: relative; padding: clamp(4rem, 10vw, 7rem) 0 4.5rem;
  background: radial-gradient(900px 500px at 85% 10%, color-mix(in srgb, var(--maroon) 14%, transparent), transparent);
  overflow: hidden; text-align: start;
}
.hero::before, .hero::after {
  content: ""; position: absolute; border-radius: 50%; filter: blur(70px); opacity: .3;
  animation: drift 14s ease-in-out infinite alternate; pointer-events: none;
}
.hero::before { width: 380px; height: 380px; background: var(--maroon2); left: -90px; top: 10px; }
.hero::after { width: 340px; height: 340px; background: #c9577a; right: 8%; bottom: -90px; animation-delay: -6s; }
@keyframes drift { to { transform: translate(50px, 35px) scale(1.15); } }

.hero-box { max-width: 760px; position: relative; z-index: 2; }
.hero h1 { font-size: clamp(2.3rem, 6vw, 4rem); font-weight: 800; color: var(--maroon); margin-bottom: .6rem; }
[data-theme="dark"] .hero h1 { color: #FFFFFF; }
.hero p.lead { color: var(--muted); font-size: 1.15rem; line-height: 1.8; margin: 1rem 0 2rem; }
.cta { display: flex; flex-wrap: wrap; gap: .85rem; }

.hv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; z-index: 0; }
.hv-shade { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s; background: linear-gradient(120deg, rgba(30,4,14,.88), rgba(101,15,42,.55)); z-index: 1; }
.hero.has-video .hv, .hero.has-video .hv-shade { opacity: 1; }
.hero.has-video h1 { color: #fff; }
.hero.has-video p.lead { color: rgba(255,255,255,.92); }
.hero.has-video .btn:not(.p) { background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.45); backdrop-filter: blur(8px); }

section { padding: 4rem 0; position: relative; }
section.alt { background: var(--surface); }
section h2 { font-size: clamp(1.8rem, 3.5vw, 2.4rem); }
section h2::after { content: ""; display: block; width: 56px; height: 4px; border-radius: 4px; margin-top: .55rem; background: linear-gradient(90deg, var(--maroon), var(--maroon2)); }
#login h2::after { margin-inline: auto; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.4rem; }

.card, .ph, .song {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
  padding: 1.5rem; box-shadow: var(--shadow); transition: transform .25s ease, box-shadow .25s ease;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px -12px rgba(101,15,42,.24); }

.ph strong { color: var(--maroon); display: block; margin-bottom: .4rem; font-size: 1.15rem; }
[data-theme="dark"] .ph strong { color: var(--ink); }

/* Timeline UI with Enhanced Image & Link Support */
.timeline { position: relative; max-width: 900px; margin: 2rem auto 0; padding-left: 2rem; border-left: 3px solid var(--maroon); }
.timeline-item {
  position: relative; margin-bottom: 2.5rem;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
  padding: 1.4rem; box-shadow: var(--shadow);
}
.timeline-item::before {
  content: ""; position: absolute; left: calc(-2rem - 9px); top: 1.4rem; width: 14px; height: 14px;
  border-radius: 50%; background: var(--maroon2); border: 3px solid #fff; box-shadow: 0 0 0 3px var(--maroon);
}
.timeline-year {
  display: inline-block; font-weight: 800; color: #fff; background: var(--maroon);
  padding: .2rem .75rem; border-radius: 99px; font-size: .9rem; margin-bottom: .6rem;
}
.timeline-img {
  width: 100%; max-height: 320px; object-fit: cover; border-radius: 12px;
  margin: .8rem 0; border: 1px solid var(--border);
}
.timeline-link {
  display: inline-flex; align-items: center; gap: .35rem; margin-top: .8rem;
  font-weight: 600; font-size: .92rem; color: var(--ink);
}
.timeline-link:hover { text-decoration: underline; }

.song { display: grid; grid-template-columns: 220px 1fr; gap: 2.5rem; align-items: center; }
@media (max-width: 760px) { .song { grid-template-columns: 1fr; } }
.disc {
  width: 200px; aspect-ratio: 1; border-radius: 50%; margin: auto; position: relative;
  background: repeating-radial-gradient(circle, #1a0a12 0 3px, #2b1321 3px 6px);
  box-shadow: 0 24px 38px -12px rgba(0,0,0,.5), inset 0 0 0 4px rgba(255,255,255,.08);
}
.disc span { position: absolute; inset: 33%; border-radius: 50%; background: linear-gradient(135deg, var(--maroon), var(--maroon2)) center/cover; box-shadow: 0 0 0 4px rgba(255,255,255,.14); }
.disc.spin { animation: spin 5s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.song audio { width: 100%; margin-top: .8rem; }
.lyrics {
  white-space: pre-line; max-height: 280px; overflow-y: auto; padding: 1.1rem 1.3rem; margin-top: 1rem;
  border-radius: 14px; background: var(--surface); border: 1px solid var(--border); line-height: 2; font-size: .95rem;
}

.prefects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1.2rem; }
.prefect-card { text-align: center; padding: 1.5rem 1rem; }
.prefect-avatar {
  width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin: 0 auto .8rem;
  border: 3px solid var(--maroon); box-shadow: var(--shadow);
}
.prefect-card h4 { margin: 0 0 .2rem; font-size: 1.05rem; }
.prefect-card p { font-size: .85rem; color: var(--muted); margin: 0; }

.achieve-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.4rem; }
.achieve-card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 12px; margin-bottom: .8rem; border: 1px solid var(--border); }

.albs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.3rem; }
.alb {
  all: unset; box-sizing: border-box; cursor: pointer; display: block; position: relative;
  border-radius: 18px; overflow: hidden; border: 1px solid var(--border); background: var(--card-bg);
  box-shadow: var(--shadow); transition: transform .3s ease, box-shadow .3s ease;
}
.alb:hover { transform: translateY(-6px); box-shadow: 0 24px 44px -16px rgba(101,15,42,.35); }
.alb img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
.alb b { display: block; padding: .9rem 1rem 1rem; font-weight: 700; color: var(--text); }
.alb .albc { position: absolute; top: .75rem; right: .75rem; padding: .25rem .7rem; border-radius: 99px; font: 600 .78rem var(--font-sans); color: #fff; background: rgba(40,6,20,.75); backdrop-filter: blur(6px); }

.ov { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 1rem; background: rgba(20,6,13,.82); backdrop-filter: blur(8px); }
.ov[hidden], .lb[hidden] { display: none; }
.ovb { width: min(1080px, 100%); max-height: 90vh; overflow-y: auto; background: var(--bg); border-radius: 20px; padding: 1.5rem; box-shadow: 0 40px 80px -20px rgba(0,0,0,.7); }
.ovh { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
.ovg { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .8rem; }
.ovg img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; cursor: zoom-in; }
.lb { position: fixed; inset: 0; z-index: 110; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .8rem; padding: 1rem; background: rgba(10,3,7,.96); }
.lb img { max-width: 90%; max-height: 86vh; margin: auto; object-fit: contain; }

label { display: block; font-weight: 600; font-size: .9rem; margin: .8rem 0 .3rem; }
input, select, textarea {
  width: 100%; min-height: 44px; padding: .65rem .85rem; border-radius: 9px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit;
}
.login { max-width: 480px; margin: 0 auto; }
.msg { min-height: 1.4em; font-weight: 600; font-size: .9rem; margin: .5rem 0; }
.msg.e { color: var(--err); } .msg.o { color: var(--ok); }
.row { display: flex; gap: .7rem; flex-wrap: wrap; }
.row > * { flex: 1; }
.tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin: 1.4rem 0; }
.tabs .btn[aria-current="true"] { background: var(--maroon); color: #FFFFFF; border-color: var(--maroon); }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: start; padding: .75rem; border-bottom: 1px solid var(--border); }
th { background: color-mix(in srgb, var(--maroon) 5%, transparent); font-weight: 700; }
.hide { display: none !important; }

footer { border-top: 1px solid var(--border); padding: 2.5rem 0; color: var(--muted); font-size: .9rem; background: var(--bg); }
.prog { position: fixed; top: 0; left: 0; height: 3px; width: 100%; background: linear-gradient(90deg, var(--maroon), var(--maroon2)); transform: scaleX(0); transform-origin: left; z-index: 60; pointer-events: none; }
</style>

/* ================= FIREBASE & ROUTING ================= */
let F, A, D, me = null;
const col = n => F.fs.collection(D, n);
const dc = (n, i) => F.fs.doc(D, n, i);
const getAll = async (n, ...c) => (await F.fs.getDocs(F.fs.query(col(n), ...c))).docs.map(d => ({ id: d.id, ...d.data() }));

async function boot() {
  const V = "10.12.2", B = `https://www.gstatic.com/firebasejs/${V}/`;
  try {
    const [app, au, fs] = await Promise.all([
      import(B + "firebase-app.js"),
      import(B + "firebase-auth.js"),
      import(B + "firebase-firestore.js")
    ]);
    F = { app, au, fs };
    const a = app.initializeApp(CFG.firebase);
    A = au.getAuth(a);
    D = fs.getFirestore(a);
    await loadAllData();

    au.onAuthStateChanged(A, async u => {
      if (!u) { me = null; $("#app").classList.add("hide"); $("#loginBox").classList.remove("hide"); return; }
      try {
        const s = await fs.getDoc(dc("users", u.uid));
        if (!s.exists() || s.data().active === false) {
          await au.signOut(A); $("#lerr").textContent = t("bad"); return;
        }
        me = { uid: u.uid, ...s.data() };
        if (me.role === "admin") {
          showApp();
        } else if (["teacher", "principal"].includes(me.role)) {
          location.href = CFG.teacherUrl;
        } else if (me.role === "student") {
          location.href = CFG.studentUrl;
        } else {
          await au.signOut(A);
          $("#lerr").textContent = t("bad");
        }
      } catch { await au.signOut(A); }
    });
  } catch (err) {
    $("#cfgMsg").textContent = "Firebase initialization error.";
    $("#cfgMsg").className = "msg e";
  }
}

async function loadAllData() {
  try {
    const [cDoc, hDocs, pDocs, achDocs, albDocs, postDocs] = await Promise.all([
      F.fs.getDoc(dc("cms", "home")),
      getAll("timeline", F.fs.orderBy("year", "asc")),
      getAll("prefects", F.fs.orderBy("order", "asc")),
      getAll("achievements", F.fs.orderBy("createdAt", "desc")),
      getAll("albums", F.fs.orderBy("createdAt", "desc")),
      getAll("posts", F.fs.orderBy("createdAt", "desc"), F.fs.limit(20))
    ]);
    if (cDoc.exists()) CMS = { ...CMS, ...cDoc.data() };
    TIMELINE = hDocs; PREFECTS = pDocs; ACHIEVEMENTS = achDocs; ALBUMS = albDocs; POSTS = postDocs;
    renderPublic();
  } catch (e) { renderPublic(); }
}

function alias(raw) {
  const u = raw.trim().toUpperCase().replace(/\s/g, "");
  let p = u === "ADMIN" ? "admin" : /^(\d{9}[VX]|\d{12})$/.test(u) ? "t" + u.toLowerCase() : /^\d{1,8}$/.test(u) ? "s" + u : null;
  return p ? `${p}@${CFG.domain}` : null;
}

$("#lf").onsubmit = async e => {
  e.preventDefault();
  const em = alias($("#u").value), pw = $("#p").value;
  if (!em || !pw) { $("#lerr").textContent = t("bad"); return; }
  $("#lbtn").disabled = true;
  try { await F.au.signInWithEmailAndPassword(A, em, pw); }
  catch { $("#lerr").textContent = t("bad"); }
  $("#lbtn").disabled = false; $("#p").value = "";
};
$("#out").onclick = () => F.au.signOut(A);

const ibbUp = async f => {
  if (!CFG.imgbbKey || !/^image\/(jpeg|png|webp)$/.test(f.type) || f.size > 8e6) throw new Error("JPG/PNG/WebP under 8MB required");
  const fd = new FormData(); fd.append("image", f);
  const r = await fetch("https://api.imgbb.com/1/upload?key=" + encodeURIComponent(CFG.imgbbKey), { method: "POST", body: fd });
  const j = await r.json();
  if (!j.success) throw new Error("Upload failed");
  return j.data.url;
};

      <form id="cfMain" class="card" style="display:flex;flex-direction:column;gap:1rem;">
        <h4>1. Hero & Branding</h4>
        <div class="row">
          <div><label>Hero Title (Sinhala)</label><input id="c_ht_si" value="${esc(CMS.hero_title_si||'')}"></div>
          <div><label>Hero Title (English)</label><input id="c_ht_en" value="${esc(CMS.hero_title_en||'')}"></div>
        </div>
        <div class="row">
          <div><label>Hero Subtitle (Sinhala)</label><textarea id="c_hl_si" rows="2">${esc(CMS.hero_lead_si||'')}</textarea></div>
          <div><label>Hero Subtitle (English)</label><textarea id="c_hl_en" rows="2">${esc(CMS.hero_lead_en||'')}</textarea></div>
        </div>
        <label>School Logo (JPG/PNG/WebP, max 5MB)</label>
        <input id="c_logo" type="file" accept="image/jpeg,image/png,image/webp">
        <label>Hero Background Video (.mp4 link starting with https://)</label>
        <input id="c_vid" value="${esc(CMS.hero_video||'')}">

        <h4>2. School Song &amp; Lyrics</h4>
        <label>Song Audio Direct URL (.mp3)</label>
        <input id="c_surl" value="${esc(CMS.song_url||'')}">
        <div class="row">
          <div><label>Song Title (Sinhala)</label><input id="c_st_si" value="${esc(CMS.song_title_si||'')}"></div>
          <div><label>Song Title (English)</label><input id="c_st_en" value="${esc(CMS.song_title_en||'')}"></div>
        </div>
        <div class="row">
          <div><label>Lyrics (Sinhala)</label><textarea id="c_ly_si" rows="6">${esc(CMS.lyrics_si||'')}</textarea></div>
          <div><label>Lyrics (English)</label><textarea id="c_ly_en" rows="6">${esc(CMS.lyrics_en||'')}</textarea></div>
        </div>

        <h4>3. About &amp; Contact Info</h4>
        <div class="row">
          <div><label>Introduction</label><textarea id="c_in" rows="2">${esc(CMS.intro_si||'')}</textarea></div>
          <div><label>Principal's Message</label><textarea id="c_pr" rows="2">${esc(CMS.principal_si||'')}</textarea></div>
        </div>
        <label>Address</label><input id="c_addr" value="${esc(CMS.address||'')}">
        <div class="row">
          <div><label>Phone</label><input id="c_ph" value="${esc(CMS.phone||'')}"></div>
          <div><label>Email</label><input id="c_em" value="${esc(CMS.email||'')}"></div>
        </div>

        <p class="msg" id="pm"></p>
        <button class="btn p" type="submit">Save &amp; Publish Website</button>
      </form>
    `);

    $("#cfMain").onsubmit = async e => {
      e.preventDefault();
      note("Updating website...", true);
      try {
        let logo = CMS.logo_url;
        const logoFile = $("#c_logo").files[0];
        if (logoFile) logo = await ibbUp(logoFile);

        const up = {
          hero_title_si: $("#c_ht_si").value.trim(), hero_title_en: $("#c_ht_en").value.trim(),
          hero_lead_si: $("#c_hl_si").value.trim(), hero_lead_en: $("#c_hl_en").value.trim(),
          logo_url: logo, hero_video: $("#c_vid").value.trim(),
          song_url: $("#c_surl").value.trim(),
          song_title_si: $("#c_st_si").value.trim(), song_title_en: $("#c_st_en").value.trim(),
          lyrics_si: $("#c_ly_si").value.trim(), lyrics_en: $("#c_ly_en").value.trim(),
          intro_si: $("#c_in").value.trim(), principal_si: $("#c_pr").value.trim(),
          address: $("#c_addr").value.trim(), phone: $("#c_ph").value.trim(), email: $("#c_em").value.trim()
        };

        await F.fs.setDoc(dc("cms", "home"), up, { merge: true });
        CMS = { ...CMS, ...up };
        renderPublic();
        note("Website updated successfully!", true);
      } catch (err) { note("Save failed: " + err.message); }
    };
  },

  /* School History Timeline CMS with Image and Link support */
  history() {
    panel(`
      <h3>School History &amp; Milestone Timeline</h3>
      <form id="hf" class="card" style="margin-bottom:1.5rem;">
        <h4>Add Milestone, Era, or Leadership Record</h4>
        <div class="row">
          <div><label>Year / Era</label><input id="h_yr" placeholder="e.g. 1954 or 1990–2005" required></div>
          <div><label>Title (Sinhala)</label><input id="h_tsi" required></div>
          <div><label>Title (English)</label><input id="h_ten"></div>
        </div>
        <div class="row">
          <div><label>Description (Sinhala)</label><textarea id="h_dsi" rows="3" required></textarea></div>
          <div><label>Description (English)</label><textarea id="h_den" rows="3"></textarea></div>
        </div>
        
        <h4 style="margin-top:1rem;">Image Attachment (Optional)</h4>
        <div class="row">
          <div>
            <label>Upload Photo (JPG/PNG/WebP, max 8MB)</label>
            <input id="h_img" type="file" accept="image/*">
          </div>
          <div>
            <label>Or Direct Image URL (https://...)</label>
            <input id="h_img_url" placeholder="https://i.ibb.co/...">
          </div>
        </div>

        <h4 style="margin-top:1rem;">Reference Link / Document (Optional)</h4>
        <div class="row">
          <div>
            <label>Reference URL (https://...)</label>
            <input id="h_link" placeholder="https://...">
          </div>
          <div>
            <label>Link Label / Button Text</label>
            <input id="h_llabel" placeholder="e.g. විශේෂ ලේඛනය / Official Record">
          </div>
        </div>

        <p class="msg" id="pm"></p>
        <button class="btn p" style="margin-top:.8rem;">Add to Timeline</button>
      </form>
      <h4>Recorded Milestones</h4>
      <div id="hlList"></div>
    `);

    const renderHList = () => {
      $("#hlList").innerHTML = TIMELINE.map(h => `
        <div style="display:flex;align-items:center;gap:1rem;margin:.6rem 0;padding:.8rem;border:1px solid var(--border);border-radius:12px;background:var(--card-bg);">
          ${h.image ? `<img src="${esc(h.image)}" style="width:70px;height:50px;object-fit:cover;border-radius:8px;">` : '<div style="width:70px;height:50px;background:var(--surface);border-radius:8px;display:grid;place-items:center;font-size:.75rem;color:var(--muted);">No Img</div>'}
          <div style="flex:1;">
            <strong>${esc(h.year)} — ${esc(h.title_si || h.title_en)}</strong>
            ${ok(h.link) ? `<br><small><a href="${esc(h.link)}" target="_blank">🔗 ${esc(h.link_label || 'Link')}</a></small>` : ''}
          </div>
          <button class="btn" data-dh="${esc(h.id)}">Delete</button>
        </div>
      `).join("") || "<p style='color:var(--muted)'>No history items.</p>";
    };
    renderHList();

    $("#hf").onsubmit = async e => {
      e.preventDefault();
      note("Adding milestone...", true);
      try {
        let imgUrl = $("#h_img_url").value.trim();
        const f = $("#h_img").files[0];
        if (f) imgUrl = await ibbUp(f);

        const item = {
          year: $("#h_yr").value.trim(),
          title_si: $("#h_tsi").value.trim(), title_en: $("#h_ten").value.trim(),
          desc_si: $("#h_dsi").value.trim(), desc_en: $("#h_den").value.trim(),
          image: imgUrl,
          link: $("#h_link").value.trim(),
          link_label: $("#h_llabel").value.trim(),
          createdAt: F.fs.serverTimestamp()
        };
        await F.fs.addDoc(col("timeline"), item);
        await loadAllData();
        P.history();
        note("Milestone added successfully!", true);
      } catch (err) { note("Add failed: " + err.message); }
    };

    $("#hlList").onclick = async e => {
      const b = e.target.closest("[data-dh]");
      if (b && confirm("Delete milestone?")) {
        await F.fs.deleteDoc(dc("timeline", b.dataset.dh));
        await loadAllData();
        P.history();
      }
    };
  },

  prefects() {
    panel(`
      <h3>Prefects Board Manager</h3>
      <form id="prf" class="card" style="margin-bottom:1.5rem;">
        <h4>Add Student Leader</h4>
        <div class="row">
          <div><label>Name</label><input id="p_nm" required></div>
          <div><label>Role (Sinhala)</label><input id="p_rsi" placeholder="ප්‍රධාන ශිෂ්‍ය නායක" required></div>
          <div><label>Role (English)</label><input id="p_ren" placeholder="Head Prefect"></div>
        </div>
        <div class="row">
          <div><label>Order (1, 2, 3...)</label><input id="p_ord" type="number" value="1" required></div>
          <div><label>Photo (JPG/PNG/WebP)</label><input id="p_img" type="file" accept="image/*"></div>
        </div>
        <p class="msg" id="pm"></p>
        <button class="btn p">Add Prefect</button>
      </form>
      <h4>Active Prefects Board</h4>
      <div id="prList"></div>
    `);

    const renderPrList = () => {
      $("#prList").innerHTML = PREFECTS.map(p => `
        <div style="display:flex;align-items:center;gap:1rem;margin:.5rem 0;padding:.6rem;border-bottom:1px solid var(--border);">
          <img src="${esc(p.photo||'')}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
          <strong style="flex:1;">${esc(p.name)} (${esc(p.role_si || p.role_en)})</strong>
          <button class="btn" data-dp="${esc(p.id)}">Delete</button>
        </div>
      `).join("") || "<p style='color:var(--muted)'>No prefects listed.</p>";
    };
    renderPrList();

    $("#prf").onsubmit = async e => {
      e.preventDefault();
      try {
        let photo = "";
        const f = $("#p_img").files[0];
        if (f) photo = await ibbUp(f);

        await F.fs.addDoc(col("prefects"), {
          name: $("#p_nm").value.trim(),
          role_si: $("#p_rsi").value.trim(), role_en: $("#p_ren").value.trim(),
          order: +$("#p_ord").value, photo, createdAt: F.fs.serverTimestamp()
        });
        await loadAllData(); P.prefects();
      } catch (err) { note("Error: " + err.message); }
    };

    $("#prList").onclick = async e => {
      const b = e.target.closest("[data-dp]");
      if (b && confirm("Remove prefect?")) {
        await F.fs.deleteDoc(dc("prefects", b.dataset.dp));
        await loadAllData(); P.prefects();
      }
    };
  },

  achieve() {
    panel(`
      <h3>Achievements &amp; Honours Manager</h3>
      <form id="acf" class="card" style="margin-bottom:1.5rem;">
        <h4>Post New School Achievement</h4>
        <div class="row">
          <div><label>Title (Sinhala)</label><input id="a_tsi" required></div>
          <div><label>Title (English)</label><input id="a_ten"></div>
          <div><label>Year / Date</label><input id="a_yr" placeholder="2026"></div>
        </div>
        <div class="row">
          <div><label>Description (Sinhala)</label><textarea id="a_dsi" rows="2"></textarea></div>
          <div><label>Description (English)</label><textarea id="a_den" rows="2"></textarea></div>
        </div>
        <label>Photo / Award Image (JPG/PNG/WebP)</label>
        <input id="a_img" type="file" accept="image/*">
        <p class="msg" id="pm"></p>
        <button class="btn p">Publish Achievement</button>
      </form>
      <h4>Published Achievements</h4>
      <div id="acList"></div>
    `);

    const renderAcList = () => {
      $("#acList").innerHTML = ACHIEVEMENTS.map(a => `
        <div style="display:flex;align-items:center;gap:1rem;margin:.5rem 0;padding:.6rem;border-bottom:1px solid var(--border);">
          ${a.image ? `<img src="${esc(a.image)}" style="width:60px;aspect-ratio:16/10;object-fit:cover;border-radius:6px;">` : ''}
          <strong style="flex:1;">${esc(a.title_si || a.title_en)} (${esc(a.year||'')})</strong>
          <button class="btn" data-da="${esc(a.id)}">Delete</button>
        </div>
      `).join("") || "<p style='color:var(--muted)'>No achievements listed.</p>";
    };
    renderAcList();

    $("#acf").onsubmit = async e => {
      e.preventDefault();
      try {
        let img = "";
        const f = $("#a_img").files[0];
        if (f) img = await ibbUp(f);

        await F.fs.addDoc(col("achievements"), {
          title_si: $("#a_tsi").value.trim(), title_en: $("#a_ten").value.trim(),
          desc_si: $("#a_dsi").value.trim(), desc_en: $("#a_den").value.trim(),
          year: $("#a_yr").value.trim(), image: img, createdAt: F.fs.serverTimestamp()
        });
        await loadAllData(); P.achieve();
      } catch (err) { note("Error: " + err.message); }
    };

    $("#acList").onclick = async e => {
      const b = e.target.closest("[data-da]");
      if (b && confirm("Delete record?")) {
        await F.fs.deleteDoc(dc("achievements", b.dataset.da));
        await loadAllData(); P.achieve();
      }

  },

  albums() {
    panel(`
      <h3>Gallery Albums Manager</h3>
      <form id="af2" class="card" style="margin-bottom:1.5rem;">
        <label>Album Title</label><input id="a_t" required>
        <label>Photos (Max 20 at once)</label>
        <input id="a_f" type="file" accept="image/*" multiple required>
        <p class="msg" id="pm"></p>
        <button class="btn p" id="abtn">Upload Album</button>
      </form>
      <h4>Active Albums</h4>
      <div id="albList"></div>
    `);

    const renderAlbList = () => {
      $("#albList").innerHTML = ALBUMS.map(a => `
        <div style="display:flex;align-items:center;gap:1rem;margin:.5rem 0;padding:.6rem;border-bottom:1px solid var(--border);">
          <img src="${esc(a.cover || a.urls[0])}" style="width:60px;height:45px;object-fit:cover;border-radius:6px;">
          <strong style="flex:1;">${esc(a.title)} (${a.urls.length} photos)</strong>
          <button class="btn" data-dal="${esc(a.id)}">Delete</button>
        </div>
      `).join("") || "<p style='color:var(--muted)'>No albums published.</p>";
    };
    renderAlbList();

    $("#af2").onsubmit = async e => {
      e.preventDefault();
      const files = [...$("#a_f").files];
      if (!files.length) return;
      $("#abtn").disabled = true;
      note("Uploading images...", true);
      try {
        const urls = [];
        for (let i = 0; i < files.length; i++) {
          urls.push(await ibbUp(files[i]));
        }
        await F.fs.addDoc(col("albums"), {
          title: $("#a_t").value.trim(),
          urls, cover: urls[0], count: urls.length, createdAt: F.fs.serverTimestamp()
        });
        await loadAllData(); P.albums();
      } catch (err) { note("Upload failed: " + err.message); }
      $("#abtn").disabled = false;
    };

    $("#albList").onclick = async e => {
      const b = e.target.closest("[data-dal]");
      if (b && confirm("Delete album?")) {
        await F.fs.deleteDoc(dc("albums", b.dataset.dal));
        await loadAllData(); P.albums();
      }
    };
  },

  async users() {
    panel("<h3>User Directory</h3><div id='ul'>Loading...</div>");
    try {
      const s = await F.fs.getDocs(col("users"));
      $("#ul").innerHTML = tbl(["Name","Role","Identifier","Grade","Status"],
        s.docs.map(d => d.data()).map(u => [
          esc(u.name), esc(u.role), esc(u.adm||u.teacherId||"—"),
          esc(u.grade?`Grade ${u.grade}`:(u.grades||[]).join(", ")||"—"),
          u.active !== false ? "<span class='msg o'>Active</span>" : "<span class='msg e'>Disabled</span>"
        ]));
    } catch { $("#ul").textContent = "Could not load users."; }
  },

  acct() {
    panel(`
      <h3>Account Settings</h3>
      <form id="af">
        <label>Current Password</label><input id="op" type="password" required>
        <label>New Password (min 10)</label><input id="np" type="password" required>
        <p class="msg" id="pm"></p>
        <button class="btn p" style="margin-top:.8rem;">Update Password</button>
      </form>
    `);
    $("#af").onsubmit = async e => {
      e.preventDefault();
      const np = $("#np").value;
      if (np.length < 10) return note("Password must be 10+ characters.");
      try {
        const u = A.currentUser;
        const cred = F.au.EmailAuthProvider.credential(u.email, $("#op").value);
        await F.au.reauthenticateWithCredential(u, cred);
        await F.au.updatePassword(u, np);
        await F.fs.setDoc(dc("users", u.uid), { mustChangePassword: false }, { merge: true });
        note("Password updated.", true); $("#af").reset();
      } catch { note("Authentication error."); }
    };
  }
};

/* Lightbox Interactions */
let curUrls = [], curIdx = 0;
const showLb = i => {
  curIdx = (i + curUrls.length) % curUrls.length;
  $("#lbi").src = curUrls[curIdx];
  $("#lb").hidden = false;
};
$("#galList").onclick = e => {
  const b = e.target.closest(".alb");
  if (!b) return;
  const a = ALBUMS[+b.dataset.i];
  curUrls = a.urls;
  $("#ovt").textContent = pick(a, "title") || a.title;
  $("#ovg").innerHTML = curUrls.map((u, i) => `<img src="${esc(u)}" data-k="${i}">`).join("");
  $("#albOv").hidden = false;
};
$("#ovg").onclick = e => { const im = e.target.closest("[data-k]"); if (im) showLb(+im.dataset.k); };
$("#lbp").onclick = () => showLb(curIdx - 1);
$("#lbn").onclick = () => showLb(curIdx + 1);
$("#lbc").onclick = () => { $("#lb").hidden = true; };
$("#ovx").onclick = () => { $("#albOv").hidden = true; };

boot();
</script>
</body>
</html>
